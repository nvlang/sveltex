packages:
  - packages/*

# pnpm 11 replaced `onlyBuiltDependencies` with `allowBuilds`, a map whose
# `true` values permit a dependency to run its install/build scripts.
allowBuilds:
  core-js-pure: true
  deno: true
  esbuild: true
  msw: true
  tree-sitter: true
  tree-sitter-cli: true

patchedDependencies:
  tree-sitter@0.25.0: patches/tree-sitter@0.25.0.patch

# `svelte-language-server` (a dependency of `@nvl/sveltex-language-server`)
# pulls in an outdated, vulnerable `svelte` transitively — six moderate SSR/XSS
# advisories. Force every `svelte` in the tree to a patched release; this is
# the hand-written equivalent of `pnpm audit --fix override`.
overrides:
  svelte: ^5.55.8

  # `@arethetypeswrong/core@0.18.2` declares `fflate: ^0.8.2`, but pnpm
  # resolves that to 0.8.3 — and fflate 0.8.3 changed `Gunzip`'s streaming
  # callback to emit trailing empty chunks. attw's tarball extractor only
  # captures the *last* callback chunk:
  #
  #     let unzipped;
  #     new Gunzip((chunk) => (unzipped = chunk)).push(tarball, true);
  #
  # so under 0.8.3 it ends up with an empty `unzipped` and crashes with
  # "Cannot read properties of undefined (reading 'filename')". Pin its
  # transitive fflate to 0.8.2 until upstream attw accumulates chunks
  # (or fflate restores the prior callback semantics).
  '@arethetypeswrong/core>fflate': 0.8.2

# pnpm 11 restricts `.npmrc` to auth/registry settings; everything else
# (such as the publish-branch guard) now lives here.
publishBranch: main
