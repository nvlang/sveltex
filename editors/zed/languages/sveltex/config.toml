name = "SvelTeX"
grammar = "sveltex"
path_suffixes = ["sveltex"]

# A `.sveltex` document is Markdown-with-Svelte; HTML-style comments work
# everywhere (in prose, around Svelte markup and inside verbatim tags).
block_comment = ["<!-- ", " -->"]

# Newline-wrapping for HTML/Svelte tags, mirroring the Svelte language config.
wrap_characters = { start_prefix = "<", start_suffix = ">", end_prefix = "</", end_suffix = ">" }

# Do not auto-close a bracket when the next character is one of these — keeps
# autoclose from firing in the middle of existing markup/expressions.
autoclose_before = ":\"'}]>) \t"

# Bracket pairs. `{ }` covers Svelte mustache tags and logic blocks; `$ $`
# and `$$ $$` cover inline and display math; the angle-bracket pairs cover
# HTML/Svelte/verbatim tags.
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "$$", end = "$$", close = true, newline = true, not_in = ["string", "comment"] },
    { start = "$", end = "$", close = true, newline = false, not_in = ["string", "comment"] },
    { start = ">", end = "</", close = false, newline = true, not_in = ["comment", "string"] },
    { start = "<", end = ">", close = false, newline = true, not_in = ["comment", "string"] },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "`", end = "`", close = true, newline = false, not_in = ["string", "comment"] },
]
