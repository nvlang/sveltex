---
name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docs.yml
      - docs/**
      - packages/vscode-sveltex/syntaxes/**
  workflow_dispatch:

permissions:
  contents: read

# One docs deployment at a time; let an in-progress run finish rather
# than cancelling it mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

# `docs/` is installed with `--ignore-workspace`, so pnpm 11 cannot see the
# root `pnpm-workspace.yaml` build-script allow-list and would hard-error
# (`ERR_PNPM_IGNORED_BUILDS`) on dependencies with install scripts. Allow all
# build scripts here — the lockfile already pins every dependency.
env:
  pnpm_config_dangerously_allow_all_builds: 'true'

jobs:
  build:
    name: Build the VitePress site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # VitePress `lastUpdated` reads each page's last-commit time.
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        name: Install pnpm

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: docs/.node-version
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      # `docs/` is a standalone project — not a pnpm-workspace member — and
      # has its own lockfile, so install it in isolation.
      - name: Install dependencies
        run: pnpm install --ignore-workspace
        working-directory: docs

      # `pnpm build` runs `build:playground`, then `vitepress build`. The
      # VitePress config reads grammars from `../packages/vscode-sveltex`,
      # so the whole repository must be checked out (it is).
      - name: Build the docs site
        run: pnpm build
        working-directory: docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
