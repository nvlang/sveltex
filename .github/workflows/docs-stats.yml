---
name: Redeploy docs on stat change

# The docs homepage quotes a few project-stat figures (lines of code, lines
# of comments, unit-test count, E2E snapshot count). The "Deploy docs to
# GitHub Pages" workflow recomputes and bakes them in on every run, so the
# published site is always current — but that workflow only runs on `docs/**`
# changes. This workflow covers the other case: a change to `@nvl/sveltex`
# that moves a *rounded* figure.
#
# It recomputes the figures and compares them against the figures from the
# previous run, kept in the Actions cache. Nothing is stored in the
# repository, so this needs no PAT and never writes to a (protected) branch.
# When a figure moved it triggers a redeploy by dispatching `docs.yml` —
# `GITHUB_TOKEN` is allowed to trigger a `workflow_dispatch`.

on:
  push:
    branches: [main]
    paths:
      - packages/sveltex/**
  workflow_dispatch:

# Top-level token is read-only; the one job that actually needs to dispatch
# the docs workflow widens its own scope below. Scorecard's
# Token-Permissions check prefers per-job grants over top-level writes.
permissions:
  contents: read

# One check at a time, so a burst of pushes can't race on the cached figures.
concurrency:
  group: docs-stats
  cancel-in-progress: false

jobs:
  redeploy-if-changed:
    name: Redeploy the docs if a rounded figure moved
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # to dispatch the "Deploy docs to GitHub Pages" workflow
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        name: Install pnpm

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      # `update-stats.mjs` shells out to `vitest list` and `cloc`.
      - name: Install dependencies
        run: pnpm install

      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install --yes cloc

      # Brings back `.stat-figures` from the most recent previous run: the
      # `run_id` key never hits exactly, so `restore-keys` restores the latest
      # entry, and a fresh entry is saved at job end.
      - name: Restore the previous figures
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .stat-figures
          key: docs-stat-figures-${{ github.run_id }}
          restore-keys: docs-stat-figures-

      - name: Redeploy the docs if a rounded figure moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current="$(node scripts/docs/update-stats.mjs | sed 's/^figures=//')"
          previous="$(cat .stat-figures 2>/dev/null || true)"
          printf '%s' "$current" > .stat-figures

          if [ "$current" = "$previous" ]; then
            echo "Rounded figures unchanged ($current) — no redeploy."
          else
            echo "Rounded figures moved (${previous:-none} -> $current) — redeploying docs."
            gh workflow run docs.yml --ref main
          fi
