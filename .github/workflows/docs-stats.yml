---
name: Redeploy docs on stat change

# The docs homepage quotes a few project-stat figures (lines of code, lines
# of comments, unit-test count, E2E snapshot count). The "Deploy docs to
# GitHub Pages" workflow recomputes and bakes them in on every run, so the
# published site is always current — but that workflow only runs on `docs/**`
# changes. This workflow covers the other case: a change to `@nvl/sveltex`
# that moves a *rounded* figure.
#
# It compares the figures the site *should* show against the figures the live
# site *does* show (scraped from the deployed page), and triggers a docs
# redeploy only when they differ. Nothing is stored in the repository, so this
# needs no PAT and never writes to a (protected) branch — the redeploy is a
# `workflow_dispatch` of `docs.yml`, which `GITHUB_TOKEN` is allowed to
# trigger.

on:
  push:
    branches: [main]
    paths:
      - packages/sveltex/**
  workflow_dispatch:

permissions:
  contents: read
  actions: write # to dispatch the "Deploy docs to GitHub Pages" workflow

# One check at a time; a burst of pushes needn't each dispatch a deploy.
concurrency:
  group: docs-stats
  cancel-in-progress: false

jobs:
  redeploy-if-changed:
    name: Redeploy the docs if a rounded figure moved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        name: Install pnpm

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      # `update-stats.mjs` shells out to `vitest list` and `cloc`.
      - name: Install dependencies
        run: pnpm install

      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install --yes cloc

      - name: Redeploy the docs if a rounded figure moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Figures the site *should* show: `<loc>-<comments>-<tests>-<snapshots>`.
          current="$(node scripts/docs/update-stats.mjs | sed 's/^figures=//')"

          # Figures the live site *does* show, scraped from the rendered page.
          html="$(curl -fsSL https://sveltex.dev/ || true)"
          figure() { printf '%s' "$html" | tr '\n' ' ' | grep -oE "$1" | grep -oE '[0-9,]+' | head -n1 | tr -d ',' || true; }
          live="$(figure 'under [0-9,]+ lines of code')-$(figure '[0-9,]+\+ lines of comments')-$(figure '[0-9,]+\+ unit tests')-$(figure '[0-9,]+\+ snapshots')"

          if [ "$current" = "$live" ]; then
            echo "Rounded figures unchanged ($current) — no redeploy."
          else
            echo "Rounded figures moved (live: $live, current: $current) — redeploying docs."
            gh workflow run docs.yml --ref main
          fi
