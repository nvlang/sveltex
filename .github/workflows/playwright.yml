---
name: E2E Visual Regression Testing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/playwright.yml
      - packages/sveltex/src/**
      - packages/sveltex/tests/e2e/**
      - packages/sveltex/playwright.config.ts
      - packages/sveltex/pnpm-lock.yaml
      - packages/sveltex/tsconfig.json
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: >-
          Regenerate the golden snapshots instead of comparing against them,
          and upload the result as an artifact for review.
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  statuses: write

# pnpm 11 hard-errors on dependency build scripts that aren't allow-listed.
# Some CI installs run outside the workspace — the e2e `_template`, and the
# throwaway projects `@nvl/sv`'s test harness scaffolds — and so can't see the
# root `pnpm-workspace.yaml` allow-list. Allow all build scripts in CI, where
# the lockfile already pins every dependency.
env:
  pnpm_config_dangerously_allow_all_builds: 'true'

jobs:
  test:
    name: Run Playwright Tests (shard ${{ matrix.shard }}/4)
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # Shard the ~1900 screenshot tests across parallel jobs — a single
    # unsharded job runs past the 60-minute limit.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up TeX Live
        uses: TeX-Live/setup-texlive-action@5ead3060cb9c2d6bf985c23b38a30669a13a3f3c # v3
        with:
          packages: |
            scheme-basic
            luatex
            xetex
            latexmk
            dvisvgm
            standalone
            pgf
            microtype
            mathtools
            luatex85
            lipsum
            xcolor

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install

      - name: Install Poppler
        run: sudo apt-get install -y poppler-data poppler-utils

      - name: Install MuPDF
        run: sudo apt-get install -y mupdf mupdf-tools

      # Playwright caching. Adapted from
      # https://github.com/microsoft/playwright/issues/7249#issuecomment-1385567519
      - name: Store Playwright Version
        run: |
          PLAYWRIGHT_VERSION=$(pnpm ls @playwright/test | grep @playwright | sed 's|.*playwright/test ||')
          echo "Playwright Version: $PLAYWRIGHT_VERSION"
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

      - name: Cache Playwright Browsers for Playwright's Version
        id: cache-playwright-browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: Setup Playwright
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps
        working-directory: packages/sveltex

      - name: Build @nvl/sveltex
        run: pnpm build

      - name: Install test-project template dependencies
        run: pnpm --ignore-workspace install
        working-directory: packages/sveltex/tests/e2e/_template

      - name: Generate per-combo test projects
        run: pnpm generate-projects
        working-directory: packages/sveltex

      - name: Build test projects
        run: pnpm test:e2e:build
        working-directory: packages/sveltex

      - name: Build the showcase site (with Deno)
        run: pnpm test:e2e:build:showcase
        working-directory: packages/sveltex

      - name: Run Playwright tests
        # On a manual `update_snapshots` run, regenerate the golden images
        # (`--update-snapshots`) instead of comparing against them; `--shard`
        # restricts this job to its quarter of the suite. Invoke the
        # Playwright binary directly with `pnpm exec`: routing through the
        # `pnpm playwright` script forwards a stray `--`, which Playwright
        # then reads as a (non-matching) test-file filter.
        run: >-
          pnpm exec playwright test
          ${{ inputs.update_snapshots && '--update-snapshots' || '' }}
          --shard=${{ matrix.shard }}/4
        working-directory: packages/sveltex

      - name: Upload Playwright Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: packages/sveltex/playwright-report/
          retention-days: 30

      - name: Upload regenerated golden snapshots for review
        # Only on a manual `update_snapshots` run. Each shard regenerates its
        # own slice of the snapshots — download all four artifacts and extract
        # them into `tests/e2e/snapshots/` to assemble the full set.
        if: ${{ always() && inputs.update_snapshots }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-golden-snapshots-shard-${{ matrix.shard }}
          path: packages/sveltex/tests/e2e/snapshots/
          retention-days: 14
