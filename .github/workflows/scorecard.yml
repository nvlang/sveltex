---
name: OpenSSF Scorecard

# Supply-chain security analysis. Runs OpenSSF Scorecard against the default
# branch, publishes the result (so the README badge stays current) and uploads
# the findings to GitHub's code-scanning dashboard.

on:
  # Re-run when branch-protection settings change — Scorecard grades them.
  branch_protection_rule:
  # Weekly, so the score keeps reflecting the current repository state.
  schedule:
    - cron: '18 9 * * 3'
  push:
    # Scorecard only analyses the default branch — `ossf/scorecard-action`
    # errors ("Only the default branch main is supported") on any other
    # branch, so this must stay `main` even though work targets `develop`.
    branches:
      - main
  # Allow running on demand — e.g. after changing repository settings that
  # could affect the score.
  workflow_dispatch:

# Read-only by default; the analysis job elevates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the SARIF results to the code-scanning dashboard.
      security-events: write
      # Needed by `publish_results` to authenticate with the OpenSSF API.
      id-token: write

    steps:
      # OpenSSF Scorecard is already a security workflow; pair it with the
      # StepSecurity egress audit so the two complement each other.
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the result to the public OpenSSF API that backs the
          # README badge. Requires a public repository.
          publish_results: true

      - name: Upload results as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload results to code-scanning
        uses: github/codeql-action/upload-sarif@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3
        with:
          sarif_file: results.sarif
