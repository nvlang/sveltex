---
name: Lint and Test

# Documentation:
# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: read
  statuses: write

# pnpm 11 hard-errors on dependency build scripts that aren't allow-listed.
# Some CI installs run outside the workspace — the e2e `_template`, and the
# throwaway projects `@nvl/sv`'s test harness scaffolds — and so can't see the
# root `pnpm-workspace.yaml` allow-list. Allow all build scripts in CI, where
# the lockfile already pins every dependency.
env:
  pnpm_config_dangerously_allow_all_builds: 'true'

jobs:
  build:
    name: Lint code base and run unit tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up TeX Live
        uses: TeX-Live/setup-texlive-action@5ead3060cb9c2d6bf985c23b38a30669a13a3f3c # v3
        with:
          packages: |
            scheme-basic
            luatex
            xetex
            latexmk
            dvisvgm
            standalone
            pgf
            microtype
            mathtools
            luatex85
            lipsum
            xcolor

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Install Poppler
        run: sudo apt-get install -y poppler-data poppler-utils

      - name: Install MuPDF
        run: sudo apt-get install -y mupdf mupdf-tools

      - name: Build
        run: pnpm build

      - name: Run ESLint and TypeScript checks
        run: pnpm lint

      - name: Run Vitest tests
        run: pnpm test
