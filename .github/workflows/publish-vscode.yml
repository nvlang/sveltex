---
name: Publish VS Code extension (manual)

# One-off helper: package and publish `packages/vscode-sveltex` to the
# VS Code Marketplace and Open VSX using the repo secrets. Standalone from
# the main release workflow — useful when a release-cycle publish failed
# and the extension needs to be retried without re-running the full
# test/build/publish pipeline.
#
# Trigger via the Actions UI ("Run workflow" button) or:
#   gh workflow run publish-vscode.yml

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize manual dispatches -- two parallel `vsce publish` calls of the
# same `.vsix` would race on the marketplace API. `cancel-in-progress:
# false` queues the second instead of aborting an in-flight publish.
concurrency:
  group: vscode-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to VS Code Marketplace + Open VSX
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        name: Install pnpm

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      # `pnpm build` builds the LSP packages whose compiled output the
      # extension bundles via esbuild. Cannot skip — `vsce package` would
      # otherwise bundle stale or absent `dist/bin/server.js` files.
      - name: Build
        run: pnpm build

      - name: Package + publish
        working-directory: packages/vscode-sveltex
        run: |
          pnpm dlx @vscode/vsce@3 package --no-dependencies -o sveltex.vsix
          pnpm dlx @vscode/vsce@3 publish --packagePath sveltex.vsix
          pnpm dlx ovsx publish sveltex.vsix \
            || echo '::warning::Open VSX publish failed — publish sveltex.vsix manually.'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
