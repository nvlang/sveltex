# Dependabot configuration.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Routine version updates are kept deliberately low-noise: grouped into one PR
# per dependency type and checked monthly. Security updates are separate — they
# are event-driven (enable "Dependabot security updates" in the repository
# settings) and are not affected by the `schedule`/`ignore` rules here.

version: 2
updates:
  # npm packages.
  - package-ecosystem: 'npm'
    directories:
      - '/packages/*/'
    target-branch: 'dependencies'
    commit-message:
      prefix: 'build(deps)'
      prefix-development: 'build(deps-dev)'
      include: 'scope'
    schedule:
      # `monthly` is the least-frequent interval available on github.com;
      # `yearly` exists only on GitHub Enterprise Server.
      interval: 'monthly'
      time: '09:00'
      timezone: 'Europe/Paris'
    # `@types/node` must track the Node version the project runs on, not the
    # newest published release, so never auto-bump it across a major. This
    # affects routine version updates only; security updates still apply.
    #
    # `tree-sitter` carries a local patch (`patches/tree-sitter@*.patch`)
    # written against one exact version; a routine bump would orphan that
    # patch and break the update. Move it by hand instead, re-patching.
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'tree-sitter'
    # At most two PRs per cycle: one for production deps, one for dev deps.
    groups:
      production-dependencies:
        dependency-type: 'production'
      development-dependencies:
        dependency-type: 'development'

  # GitHub Actions workflow dependencies.
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'dependencies'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    schedule:
      interval: 'monthly'
      time: '09:00'
      timezone: 'Europe/Paris'
    # One grouped PR per cycle, rather than one per action.
    groups:
      github-actions:
        patterns:
          - '*'

  # Zed extension's Rust crate. Only one direct dependency
  # (`zed_extension_api`), so a monthly cadence is plenty -- StepSecurity
  # bot suggested daily, which would be noise.
  - package-ecosystem: 'cargo'
    directory: '/editors/zed'
    target-branch: 'dependencies'
    commit-message:
      prefix: 'build(deps)'
      include: 'scope'
    schedule:
      interval: 'monthly'
      time: '09:00'
      timezone: 'Europe/Paris'
