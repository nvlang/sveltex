---
name: Bug report
description: Something in SvelTeX is broken or behaves unexpectedly.
title: 'bug: '
labels: ['bug']

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. A small, runnable
        reproduction is the single most useful thing you can share — a
        StackBlitz, a public repo, or a few `pnpm`/`npx sv` commands that
        lead to the failure.

        **Security issue?** Stop here and open a [private advisory] instead.

        [private advisory]: https://github.com/nvlang/sveltex/security/advisories/new

  - type: checkboxes
    id: preflight
    attributes:
      label: Before filing
      options:
        - label: >-
            I have searched [existing issues](https://github.com/nvlang/sveltex/issues?q=is%3Aissue)
            and [discussions](https://github.com/nvlang/sveltex/discussions)
            for duplicates.
          required: true
        - label: I am on the latest published version of the affected package.
          required: true
        - label: >-
            This is not a security vulnerability (those go via [private
            advisory](https://github.com/nvlang/sveltex/security/advisories/new)).
          required: true

  - type: dropdown
    id: package
    attributes:
      label: Affected package
      description: Pick the closest match if unsure.
      options:
        - '@nvl/sveltex (core preprocessor)'
        - '@nvl/sveltex-language-server'
        - '@nvl/sveltex-math-language-server'
        - '@nvl/tree-sitter-sveltex'
        - '@nvl/sv-sveltex (Svelte CLI add-on)'
        - 'VS Code extension (sveltex-preprocessor.sveltex)'
        - 'Zed extension'
        - 'sveltex.dev (docs site)'
        - 'Monorepo tooling / CI'
        - 'Other / unsure'
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      description: >-
        For npm packages, the output of e.g. `pnpm why @nvl/sveltex`. For an
        editor extension, the version shown in the marketplace UI.
      placeholder: 'e.g. 0.4.4'
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      description: 'Node version, OS, package manager — whichever is relevant.'
      placeholder: 'e.g. Node 22.11.0, macOS 15.1, pnpm 11.1.2'

  - type: checkboxes
    id: backends
    attributes:
      label: Backends in use (if applicable)
      description: Only relevant for `@nvl/sveltex` and the math language server.
      options:
        - label: 'markdown: `unified`'
        - label: 'markdown: `markdown-it`'
        - label: 'markdown: `marked`'
        - label: 'markdown: `micromark`'
        - label: 'markdown: `custom`'
        - label: 'code: `shiki`'
        - label: 'code: `starry-night`'
        - label: 'code: `highlight.js`'
        - label: 'code: `escape`'
        - label: 'math: `mathjax`'
        - label: 'math: `katex`'
        - label: 'math: `custom`'
        - label: 'TeX: local LaTeX install (`<tex>` / `<tikz>`)'

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: >-
        A clear, concise description of the bug — what you expected, and what
        you observed instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        A link to a StackBlitz, a public repo, or a self-contained snippet
        that demonstrates the issue. Bugs without a reproduction often
        cannot be acted on.
      placeholder: 'https://stackblitz.com/edit/…  or  https://github.com/your-handle/repro'
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, stack traces, screenshots
      description: >-
        Console output, error messages, LSP traces, screenshots. Wrap long
        output in a `<details>` block.
      render: shell
