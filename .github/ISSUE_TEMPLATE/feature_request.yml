---
name: Feature request
description: Propose a new feature, option, or improvement.
title: 'feat: '
labels: ['enhancement']

body:
  - type: markdown
    attributes:
      value: |
        Substantial changes — new backends, new public API, format
        changes — benefit from early feedback. Consider [starting a
        discussion](https://github.com/nvlang/sveltex/discussions) before
        filing this if you'd like to sound out the shape of the idea first.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before filing
      options:
        - label: >-
            I have searched existing issues and discussions for similar
            requests.
          required: true
        - label: >-
            I have read the [contributing
            guide](https://github.com/nvlang/sveltex/blob/main/CONTRIBUTING.md).
          required: true

  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - '@nvl/sveltex (core preprocessor)'
        - '@nvl/sveltex-language-server'
        - '@nvl/sveltex-math-language-server'
        - '@nvl/tree-sitter-sveltex'
        - '@nvl/sv-sveltex (Svelte CLI add-on)'
        - 'VS Code extension'
        - 'Zed extension'
        - 'sveltex.dev (docs site)'
        - 'Cross-cutting / multiple'
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is affected, and how?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Sketch the API or UX if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried, or competing designs you've weighed.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, prior art in other tools, related issues.
